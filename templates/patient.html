{% extends "base.html" %}{% block body %}
<h2>Patient check-in</h2>
<form id="f" class="card card-body mb-3" style="max-width:480px">
<label class="form-label">Name</label><input name="name" class="form-control mb-2" required>
<label class="form-label">How severe? (1 mild – 5 critical)</label>
<select name="severity" class="form-select mb-3">{% for i in range(1,6) %}<option>{{i}}</option>{% endfor %}</select>
<button class="btn btn-primary">Check in</button></form>
<div id="out"></div>
{% endblock %}{% block scripts %}<script>
f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));
const [ok,r]=await post('/api/checkin',d);
out.innerHTML=`<div class="card card-body" style="max-width:480px"><h5>${r.patient.id}</h5><p>Estimated wait: ${r.wait} min</p>
<img src="/api/qr/${r.patient.id}" width="200"><p class="text-muted small">Show this QR code to staff.</p></div>`;};
</script>{% endblock %}
